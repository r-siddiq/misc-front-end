<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earthquake Results</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>Earthquake Results</h1>
    <div id="results"></div>

    <script>
        const data = JSON.parse(localStorage.getItem('earthquakeData'));
        const resultsDiv = document.getElementById('results');

        if (data && data.features.length > 0) {
            data.features.forEach(eq => {
                const div = document.createElement('div');
                div.innerHTML = `
                    <p><strong>Location:</strong> ${eq.properties.place}</p>
                    <p><strong>Magnitude:</strong> ${eq.properties.mag}</p>
                    <p><strong>Date:</strong> ${new Date(eq.properties.time).toLocaleString()}</p>
                    <hr>
                `;
                resultsDiv.appendChild(div);
            });
        } else {
            resultsDiv.textContent = "No earthquakes found matching your criteria.";
        }
    </script>
    
</body>
</html>
