<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Earthquake Data Finder</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    #map { width: 100%; height: 400px; border: 1px solid #ccc; margin-top: 10px; }
    #coords { margin: 8px 0; font-size: 0.95rem; color: #333; }
    #errorMessage { margin-top: 8px; color: crimson; }
  </style>
</head>
<body>
  <h1>Earthquake Data Finder</h1>

  <form id="earthquakeForm">
    <label for="startDate">Start Date:</label>
    <input type="date" id="startDate" required><br>

    <label for="endDate">End Date:</label>
    <input type="date" id="endDate" required><br>

    <label for="minMag">Minimum Magnitude:</label>
    <input type="number" id="minMag" required min="1" step="0.1"><br>

    <label for="maxMag">Maximum Magnitude:</label>
    <input type="number" id="maxMag" required min="1" step="0.1"><br>

    <!-- New: optional radius for point+radius queries -->
    <label for="radiusKm">Radius (km):</label>
    <input type="number" id="radiusKm" min="1" step="1" value="100"><br>

    <!-- Optional: show coordinates of the clicked pin -->
    <div id="coords">
      <strong>Selected point:</strong>
      <span id="latitude">—</span>, <span id="longitude">—</span>
    </div>

    <div id="map"></div><br>

    <button type="submit">Search Earthquakes</button>
    <div id="loading" class="hidden" aria-live="polite">fetching your results in a quick shake... please wait</div>
    <div id="errorMessage"></div>
  </form>

  <!-- Load Google Maps API -->
  <script src="config.js"></script>

  <!-- Your app script (contains initMap + handlers) -->
  <script src="js/script.js" defer></script>

</body>
</html>
